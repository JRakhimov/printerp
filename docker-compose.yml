services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: printerp_api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT:-3011}
      NODE_ENV: ${NODE_ENV:-production}
      DEV_BYPASS_AUTH: ${DEV_BYPASS_AUTH:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-123456789:ABCdefGHIjklMNOpqrsTUVwxyZ}
      INITIAL_OWNER_TELEGRAM_ID: ${INITIAL_OWNER_TELEGRAM_ID:-123456789}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://printerp.y3110w.com,http://localhost:3012,http://localhost:5173}
    ports:
      - "${PORT:-3011}:${PORT:-3011}"
    networks:
      - homelab_net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api-printerp.y3110w.com}
    container_name: printerp_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3012}:80"
    depends_on:
      - api

volumes:
  postgres_data:

networks:
  homelab_net:
    external: true
