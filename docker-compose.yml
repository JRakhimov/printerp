version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: printerp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-printerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-printerp_secret}
      POSTGRES_DB: ${POSTGRES_DB:-printerp_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-printerp} -d ${POSTGRES_DB:-printerp_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: printerp_api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-printerp}:${POSTGRES_PASSWORD:-printerp_secret}@postgres:5432/${POSTGRES_DB:-printerp_db}?schema=public}
      PORT: 3011
      NODE_ENV: ${NODE_ENV:-development}
      DEV_BYPASS_AUTH: ${DEV_BYPASS_AUTH:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-123456789:ABCdefGHIjklMNOpqrsTUVwxyZ}
      INITIAL_OWNER_TELEGRAM_ID: ${INITIAL_OWNER_TELEGRAM_ID:-123456789}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-in-production-3d-print-erp}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3012,http://localhost:3011,http://127.0.0.1:3012}
    ports:
      - "3011:3011"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: printerp_web
    restart: unless-stopped
    ports:
      - "3012:80"
    depends_on:
      - api

volumes:
  postgres_data:
