<!DOCTYPE html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>PrintERP</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      try {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
          if (typeof window.Telegram.WebApp.disableVerticalSwipes === 'function') {
            window.Telegram.WebApp.disableVerticalSwipes();
          }
          if (typeof window.Telegram.WebApp.setHeaderColor === 'function') {
            window.Telegram.WebApp.setHeaderColor('#0f172a');
          }
          if (typeof window.Telegram.WebApp.setBackgroundColor === 'function') {
            window.Telegram.WebApp.setBackgroundColor('#020617');
          }
        }
      } catch (e) {
        console.error('Telegram WebApp early init error:', e);
      }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen font-sans selection:bg-blue-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
